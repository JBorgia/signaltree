name: Validate

# Runs the full gate set (§5 rule 3): lint, typecheck, tests, builds, and the
# doc-truth verifiers (taught symbols + version claims) on every PR and every
# push to main. Previously no CI ran these gates at all.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Lint, typecheck, test, build, verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The gates read dist/ — barrels, bundle budgets, foldability, tarball
      # contents. `gates` verifies a build; it does not produce one.
      - name: Build all packages
        run: pnpm run build:all

      - name: All gates (lint budget, typecheck, tests, barrels, exports, docs, budgets, harnesses)
        run: pnpm run gates

      - name: Prove every gate can still fail
        run: pnpm run gates:self-test

  demo-route-smoke:
    name: Demo route smoke (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build demo (production)
        run: pnpm exec nx build demo --configuration=production

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Route smoke (8 key routes, no console errors, visible h1/main)
        run: pnpm run smoke:routes
