name: Deploy Demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

env:
  V15_COMMIT: 35980f1fa7fc35f16dad072bf040f9b8461d4d9b

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout v14 archive
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: legacy-site
          persist-credentials: false

      - name: Checkout current v15 site
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: JBorgia/signal-tree
          ref: ${{ env.V15_COMMIT }}
          path: current-site
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.3.0'
          cache: pnpm
          cache-dependency-path: |
            legacy-site/pnpm-lock.yaml
            current-site/pnpm-lock.yaml

      - name: Install v14 dependencies
        working-directory: legacy-site
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build preserved v14 site
        working-directory: legacy-site
        env:
          NX_CLOUD: 'false'
          NX_DAEMON: 'false'
        run: |
          pnpm nx build demo --configuration=production --base-href=/v14/
          node scripts/generate-spa-route-shells.mjs
          mkdir -p "$RUNNER_TEMP/v14-site"
          cp -R dist/apps/demo/browser/. "$RUNNER_TEMP/v14-site/"

      - name: Install v15 dependencies
        working-directory: current-site
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build current v15 site
        working-directory: current-site
        env:
          NX_CLOUD: 'false'
          NX_DAEMON: 'false'
        run: |
          pnpm nx build demo --configuration=production --base-href=/
          node scripts/generate-spa-route-shells.mjs

      - name: Compose and verify Pages artifact
        run: |
          site="current-site/dist/apps/demo/browser"
          test "$(git -C current-site rev-parse HEAD)" = "$V15_COMMIT"
          mkdir -p "$site/v14"
          cp -R "$RUNNER_TEMP/v14-site/." "$site/v14/"
          rm -f "$site/v14/CNAME" "$site/v14/.nojekyll"
          touch "$site/.nojekyll"

          test -f "$site/index.html"
          test -f "$site/why-causality/index.html"
          test -f "$site/v14/index.html"
          test -f "$site/v14/examples/fundamentals/index.html"
          test -f "$site/CNAME"
          test ! -e "$site/v14/CNAME"
          grep -Fxq 'signaltree.io' "$site/CNAME"
          grep -Fq '<base href="/">' "$site/index.html"
          grep -Fq '<base href="/v14/">' "$site/v14/index.html"
          grep -Fq 'Version 15 is a ground-up causal rewrite' "$site"/chunk-*.js
          grep -Fq 'SignalTree v14 archive' "$site/v14"/main-*.js
          grep -Fq 'Version 15 is a ground-up causal rewrite' "$site/v14"/main-*.js

      - name: Setup Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./current-site/dist/apps/demo/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
